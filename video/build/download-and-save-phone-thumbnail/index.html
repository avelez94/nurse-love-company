<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      
    @font-face { font-family: 'DM Serif Display'; src: url('assets/fonts/dm-serif-display-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-style: normal; }
    @font-face { font-family: 'Nunito Sans'; src: url('assets/fonts/nunito-sans-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-style: normal; }
    @font-face { font-family: 'Nunito Sans'; src: url('assets/fonts/nunito-sans-latin-600-normal.woff2') format('woff2'); font-weight: 600; font-style: normal; }
    @font-face { font-family: 'Nunito Sans'; src: url('assets/fonts/nunito-sans-latin-700-normal.woff2') format('woff2'); font-weight: 700; font-style: normal; }
    @font-face { font-family: 'Nunito Sans'; src: url('assets/fonts/nunito-sans-latin-800-normal.woff2') format('woff2'); font-weight: 800; font-style: normal; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff0f2; }
      #thumb { position: absolute; inset: 0; background: #fff0f2; font-family: 'Nunito Sans', sans-serif; color: #680c35; }
      #thumb-copy { position: absolute; left: 110px; top: 190px; width: 880px; }
      #thumb-eyebrow { display: inline-block; font-weight: 800; font-size: 36px; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; background: #d80853; border-radius: 999px; padding: 10px 28px; margin-bottom: 34px; }
      #thumb-title { font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 118px; line-height: 1; margin-bottom: 34px; }
      #thumb-sub { font-size: 46px; font-weight: 700; color: #7d3a55; }
      #thumb-card { position: absolute; left: 1060px; top: 190px; width: 760px; height: 700px; border-radius: 34px; background: #fff; overflow: hidden; box-shadow: 0 0 0 3px #efd8df, 0 30px 70px rgb(104 12 53 / 0.18); }
      #thumb-img { position: absolute; left: 0px; top: -721.795px; width: 760px; height: 1644.718px; }
      #thumb-hl { position: absolute; left: 52.308px; top: 501.692px; width: 306.564px; height: 109.744px; border-radius: 20px; border: 6px solid #d80853; box-shadow: 0 0 0 10px rgb(216 8 83 / 0.16); }
    </style>
  </head>
  <body>
    <div id="thumb" data-composition-id="thumb" data-start="0" data-duration="1" data-width="1920" data-height="1080" data-no-timeline>
      <div id="thumb-copy">
        <div id="thumb-eyebrow">Tutorial</div>
        <h1 id="thumb-title">How to download and save your goodies</h1>
        <p id="thumb-sub">On a phone</p>
      </div>
      <div id="thumb-card"><img id="thumb-img" src="assets/screens/phone-05-downloads.webp" alt="" /><div id="thumb-hl"></div></div>
    </div>
  </body>
</html>
