# Render Blueprint for the Nurse Love Company STAGING preview.
# See DEPLOYMENT.md for the step by step guide and every environment variable.
#
# This file creates ONE free web service. It does not create a database or
# storage bucket (those come from Neon and Cloudflare R2, see DEPLOYMENT.md),
# and it never sets real credentials: values marked "sync: false" are typed
# into the Render dashboard, and secrets marked "generateValue" are random
# values Render creates for you.

services:
  - type: web
    name: nurse-love-staging
    runtime: node
    # Free plan: no cost, but it sleeps after about 15 idle minutes and wakes
    # on the next visit (the first page load can take up to a minute).
    # Change to "starter" (paid) if you want it always awake.
    plan: free
    branch: main
    autoDeploy: true
    # Build tools (TypeScript, Vite) are dev dependencies, so include them.
    buildCommand: npm ci --include=dev && npm run build
    # Applies database migrations (safe to repeat), then serves the site and API.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # --- Deployment ---
      - key: NODE_VERSION
        value: "22"
      - key: DEPLOY_ENV
        value: staging
      - key: APP_URL
        sync: false # https address of this service, e.g. https://nurse-love-staging.onrender.com
      - key: BETTER_AUTH_SECRET
        generateValue: true

      # --- Staging access gate (whole site; webhooks and /api/health excepted) ---
      - key: STAGING_ACCESS_USER
        value: nurselove
      - key: STAGING_ACCESS_PASSWORD
        generateValue: true

      # --- First admin (one time code; remove after use) ---
      - key: ADMIN_BOOTSTRAP_TOKEN
        generateValue: true

      # --- Labeled demo content: off until you deliberately set "true" ---
      - key: DEMO_CONTENT
        value: "false"

      # --- Database (Neon or Supabase PostgreSQL connection string) ---
      - key: DATABASE_URL
        sync: false

      # --- Private file storage (Cloudflare R2, S3 compatible) ---
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # --- Payments: Stripe TEST keys only. Live payments are always off on staging. ---
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: LIVE_PAYMENTS_APPROVED
        value: "false"

      # --- Email (optional; without it emails are logged and not sent) ---
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false

      # --- Tutorial video. "local" keeps videos in the bucket (MP4 only on Render). ---
      - key: VIDEO_PROVIDER
        value: local
      - key: MUX_TOKEN_ID
        sync: false
      - key: MUX_TOKEN_SECRET
        sync: false
      - key: MUX_WEBHOOK_SECRET
        sync: false
      - key: MUX_SIGNING_KEY_ID
        sync: false
      - key: MUX_SIGNING_PRIVATE_KEY
        sync: false

      # --- Upload limits sized for the free plan's memory (files pass through the server) ---
      - key: MAX_PRODUCT_FILE_MB
        value: "100"
      - key: MAX_IMAGE_MB
        value: "10"
      - key: MAX_VIDEO_MB
        value: "150"
